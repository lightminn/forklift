# RTAB-Map 0.23.13 for the rig comparison (docs/plans/2026-10-07-visual-slam-and-fusion.md D3).
# Upstream defaults unless listed. Every value here is a CHANGE from the upstream
# default (rtabmap --params), with the reason. Frames, subscriptions and the
# per-mode registration choices are set in launch/rig_slam.launch.py.
# Tuned on development seed 0 only; frozen before the evaluation seeds.

"/**/rgbd_odometry":
  ros__parameters:
    use_sim_time: true
    publish_tf: false              # the bridge fuses the odometry and publishes fused->odom
    wait_for_transform: 0.5        # 0.1: the bridge publishes odom->base_link just before
    approx_sync: false             # every rig image shares the frame stamp exactly
    qos: 1                         # 0 (system default -> best effort here): a 6 MB
                                   # four-camera message dropped whole; the bridge waits anyway
    qos_camera_info: 1
    subscribe_rgbd: true
    rgbd_cameras: 0                # 0 = one rtabmap_msgs/RGBDImages carrying all cameras
    topic_queue_size: 10
    sync_queue_size: 10
    Reg/Force3DoF: "true"          # flat floor: x, y, yaw only
    Odom/Holonomic: "false"        # Ackermann truck
    Odom/ResetCountdown: "1"       # 0: restart right after a lost frame -- otherwise a 20 s
                                   # sensor blackout left it lost for good (dev seed 0); the
                                   # bridge fuses increments only, so a new origin is harmless
    Vis/MaxDepth: "8.0"            # the rig's far limit
    Vis/MinInliers: "20"
    Vis/EstimationType: "0"        # 1 (PnP): multi-camera PnP needs OpenGV, which the
                                   # Jazzy binary lacks; 3D-3D for every vision config alike

"/**/icp_odometry":
  ros__parameters:
    use_sim_time: true
    qos: 1                         # reliable, as above
    publish_tf: false              # as rgbd_odometry
    wait_for_transform: 0.5
    topic_queue_size: 10
    Reg/Force3DoF: "true"
    Odom/Holonomic: "false"
    Odom/ResetCountdown: "1"       # as rgbd_odometry
    Icp/VoxelSize: "0.05"
    Icp/RangeMax: "12.0"           # the A2M12 catalogue range
    Icp/MaxTranslation: "0.5"      # 0.2: a held correction can be stale by a blackout
    Icp/PointToPlaneK: "10"        # 5: 2D scans, normals from more neighbours
    Icp/CorrespondenceRatio: "0.2" # 0.1
    Icp/Epsilon: "0.001"
    OdomF2M/ScanSubtractRadius: "0.05"
    OdomF2M/ScanMaxSize: "15000"

"/**/rtabmap":
  ros__parameters:
    use_sim_time: true
    publish_tf: true
    wait_for_transform: 0.5
    approx_sync: false
    qos: 1                         # reliable, as above
    qos_image: 1
    qos_camera_info: 1
    qos_scan: 1
    qos_odom: 1
    topic_queue_size: 10
    sync_queue_size: 10
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_odom_info: false
    Rtabmap/DetectionRate: "0"     # 1: the bridge decides keyframes; process every one sent
    RGBD/LinearUpdate: "0"         # 0.1: same reason
    RGBD/AngularUpdate: "0"        # 0.1: same reason
    Reg/Force3DoF: "true"
    Mem/STMSize: "30"              # 10: keep loop closures away from the last few metres
    # Loop closure by proximity to the current estimate only (dev seed 0, plan D3):
    Rtabmap/LoopThr: "1.1"         # 0.11: appearance (global) loop closure off -- on seed 0
                                   # it accepted 13.4 m and 6.6 m false closures between
                                   # identical pallet aisles (perceptual aliasing)
    RGBD/ProximityMaxGraphDepth: "0"           # 50: every node near the estimate, not only recent ones
    RGBD/LocalRadius: "2.0"                    # 10: candidates within 2 m of the estimate
    RGBD/ProximityPathFilteringRadius: "2.0"   # 1: one-to-one (visual) candidates up to 2 m too;
                                               # at 1 m the drifted vision run found 4 links, at 2 m 36
    RGBD/ProximityAngle: "180"                 # 45: the rig sees all around; registration decides
    Grid/3D: "false"               # 2D occupancy grid only
    Grid/RangeMax: "8.0"           # 5.0: the rig's far limit
    Grid/CellSize: "0.05"
    Grid/NormalsSegmentation: "false"
    Grid/MaxGroundHeight: "0.05"   # passthrough ground split for depth grids
    Grid/MaxObstacleHeight: "2.0"
    Vis/MaxDepth: "8.0"
    Vis/EstimationType: "0"        # as in rgbd_odometry
    Icp/VoxelSize: "0.05"
    Icp/RangeMax: "12.0"
    Icp/MaxTranslation: "1.0"      # 0.2: loop closures between revisits
    Icp/PointToPlaneK: "10"
    Icp/CorrespondenceRatio: "0.2"
    Icp/Epsilon: "0.001"
