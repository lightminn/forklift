# Faster synthetic drive profile (2026-09-26): the user asked for a top speed of
# 8 km/h = 2.22 m/s. Same simulator-only actuation as isaac_transport.yaml; only
# cruise speeds, acceleration and the wheel-rate cap differ. Not identified
# hardware parameters. Insertion keeps the slow pocket-clearance speed.
physics_hz: 120
pallet_mass_kg: 10.0
static_friction: 0.8
dynamic_friction: 0.7
wheel_torque_nm: 3.0
steering_torque_nm: 20.0
steering_stiffness: 1000.0
steering_damping: 100.0
steering_command_rate_rad_s: 1.0
lift_force_n: 180.0
lift_target_m: 0.20
lift_rate_mps: 0.06
planner_curvature_inv_m: 0.50
tracker_curvature_inv_m: 0.62
planning_clearance_m: 0.10
approach_speed_mps: 2.22      # 8 km/h; isaac_transport.yaml 0.60 (also observe and return)
transport_speed_mps: 2.22     # 8 km/h, loaded; 0.30
extract_speed_mps: 0.30       # 0.18
withdraw_speed_mps: 0.30      # 0.12
insert_speed_mps: 0.055       # unchanged: pocket clearance
drive_acceleration_mps2: 0.50 # 0.30; 0.80 stopped 12 mm off a goal (2026-09-26)
# 18 rad/s x 0.135 m = 2.43 m/s: room for the outer wheel in a 2 m-radius turn at
# 2.22 m/s (factor 1.13), where the command otherwise scales speed down; 8.0
max_wheel_rate_rad_s: 18.0
# Path speed caps (optional keys; isaac_transport.yaml leaves them off). At
# 8 km/h, and still at 0.8 m/s, a loaded reverse turn on the 2 m planner radius
# left the path with the steering saturated until the footprint check stopped
# the run (2026-09-26). What limits the turn is the synthetic steering rate
# (1 rad/s: 0.45 rad takes 0.45 s), not grip, so the "lateral acceleration" here
# is a curve-speed setting: sqrt(0.06 / 0.5) = 0.35 m/s on every 2 m arc, close
# to the 0.30 m/s transport speed that tracked those arcs. Straights keep
# 8 km/h; the tracker brakes ahead of each curve. Reverse never exceeds 0.8 m/s.
max_lateral_acceleration_mps2: 0.06
max_reverse_speed_mps: 0.8
