method: 'Each capture is a folder of 30 raw Z16 frames with capture.json (tools/capture_d435i_noise.py).
  Every frame is dithered by +-0.5 mm (a seeded stream per frame) and turned to inverse
  depth, then fitted two ways with depth_noise_fit.fit_noise_components on the robust
  variance of inverse-depth second differences at steps 1-32:'
