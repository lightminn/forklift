limitations:
- 'no reference flat: fixed spatial error and absolute bias are not separated; the
  frame levels are a scenario of one observed wall frame, not an upper bound'
- 'a plane in inverse depth cancels in second differences and slow warps are attenuated:
  whole-frame tilt or shift and lens warps are not guaranteed to be represented'
- 'one k for 2-3 m: the measured sigma grows slightly faster than z^2'
- 'Gaussian components: the measured heavy tails are not reproduced (see the reproduction
  report)'
- 'random dropout at the provisional rate: persistent invalid pixels are not reproduced'
- static tripod, indoor fluorescent light, one team D435i
