# The real A2M12's one source for its mount, self mask and timing bounds (PR 7 design 4, 7a-1).
# Read by the observe run's scan conversion and by the teleop bridge when --lidar-mount / --lidar-mask are not given.
# Every value is provisional until measured (S7): mount.measured: false and timing.basis: null keep it out of
# operating use.
mount:
  xyz: [0.0, 0.0, 0.0]     # rear-axle frame, metres -- placeholder
  yaw_deg: 0.0
  measured: false
self_mask_deg: []          # sensor-frame angle intervals [a, b] (degrees, -180..180) the truck's own body hides
height_band:
  max_tilt_deg: 1.0        # same values as obstacle_layer_real.yaml bridge: (limit_m = band_half_m / sin(tilt))
  band_half_m: 0.10
timing:
  # a layer scan needs (last beam hi - first beam lo) <= this (design 4): one rotation (~98 ms at 10 Hz) plus the
  # error bound at both ends -- the real run's layer takes its first-beam budget from here (wired with 7r). If the
  # bench's bound makes a rotation wider, this and the stop model's budget are raised together, documented
  scan_period_s: 0.12
  # the SDK sample time's error bound (7a-3, docs/plans/2026-11-26-7a3-sdk-arrival-stamp.md): null until the bench.
  # It applies only to frames stamped at the receive thread's byte arrival (patch 0002) whose source facts equal
  # applies_to (forklift_core.sensors.lidar_cfg.frame_bound); every other frame is diagnostic only.
  first_beam_err_s: null
  # what the bound rests on: null (no bound), measured, or engineering -- an engineering bound is the lead's
  # exception decision with its assumptions written down (decision_id, basis_doc); it is never written as measured
  basis: null
  decision_id: null
  basis_doc: null
  # with a basis: exactly image_id (docker image ID), usb (udev vendor:product:serial), host, ans_type,
  # sample_period_us, baudrate (the node's scan_sdk_info) -- the source the bound was taken on
  applies_to: null
# the A2M12 driver image (7a-3 plan 5): the one place its tag is written. tools/scan_image.py computes it from the
# patches and deploy/ros2/Dockerfile.scan; the build entry points stop when it differs, tools/ros2_dev.sh and the
# hwday scripts run it. A timing bound names the image ID that ran (timing.applies_to.image_id), never this tag.
scan_image:
  amd64: forklift/ros2-scan:jazzy-seb850403
  arm64: forklift/ros2-scan:jazzy-sccf9d154-arm64
