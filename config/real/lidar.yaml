# The real A2M12's one source for its mount, self mask and timing bounds (PR 7 design 4, 7a-1).
# Read by the observe run's scan conversion and by the teleop bridge when --lidar-mount / --lidar-mask are not given.
# Every value is provisional until measured (S7): measured: false keeps it out of operating use.
mount:
  xyz: [0.0, 0.0, 0.0]     # rear-axle frame, metres -- placeholder
  yaw_deg: 0.0
  measured: false
self_mask_deg: []          # sensor-frame angle intervals [a, b] (degrees, -180..180) the truck's own body hides
height_band:
  max_tilt_deg: 1.0        # same values as obstacle_layer_real.yaml bridge: (limit_m = band_half_m / sin(tilt))
  band_half_m: 0.10
timing:
  # a layer scan needs (last beam hi - first beam lo) <= this (design 4): one rotation (~98 ms at 10 Hz) plus the
  # error bound at both ends -- the real run's layer takes its first-beam budget from here (wired with 7r). If the
  # bench's bound makes a rotation wider, this and the stop model's budget are raised together, documented
  scan_period_s: 0.12
  # the SDK sample time's error bound: acquisition can only precede its bytes' arrival, by at most one capsule's
  # sampling + its serial transfer + the USB-UART latency_timer (design 9 item 1); null until the bench measures it
  first_beam_err_s: null
  measured: false
