# Provisional depth-noise model for the stage 1B Isaac baseline (role: provisional).
# Generated by tools/calibrate_depth_noise.py on UBAI run 20261015T164516Z from MR6D (CC-BY-4.0);
# a model of MR6D background inverse-depth variation, not a sensor measurement -- see limitations
# and levels_note. The official noise waits for a team D435i capture
# (docs/validation/2026-10-16-d435i-noise-capture-procedure.md).
source: Hugging Face anas-gouda/mr6d (MR6D, Intel RealSense D435i)
license: CC-BY-4.0
revision: 3c4ed8453312655499c3d3a3cf38b4929fae77ee
role: provisional
retrieved: '2026-10-16'
method: per-frame two-component fit (depth_noise_fit.fit_noise_components) of the
  robust variogram of inverse-depth second differences, steps 1-32, on background
  pixels (margin_px from every visible object mask and invalid pixel) after a seeded
  +-0.5 mm dither of the whole-millimetre depth; components sorted by width into short
  and long; no acceptance gate -- the distribution over usable frames is reported
  and the levels are its percentiles
history:
- '2026-10-15 plan v2 method (single correlated component, frames accepted only at
  fit residual <= 0.15): UBAI job 1012969 stopped on a frame whose MAD was 0 (over
  half the 1 px second differences of whole-millimetre depth are exactly 0); run 20261015T144823Z
  (zero-variance frames rejected) accepted 0/240 frames; with the dither the single-component
  residual was 0.50-0.55 on every probed frame'
- 'Codex 2026-10-16: a gate on steps 4-32 passed a model that underpredicts vertical
  step 1 by 91 %; patch plane residuals of the same image cannot separate sensor error
  from surface shape; dither plus MAD is not additive -- so these values are a model
  of MR6D background inverse-depth variation, not a sensor measurement'
- 'user decision 2026-10-16: provisional low/mid/high levels for the stage 1B baseline;
  the official noise population waits for a team D435i capture'
