limitations:
- 'a model of MR6D background inverse-depth variation: second differences and patch
  residuals cannot tell sensor error from surface shape, so the long component may
  include real surface relief'
- MR6D depth is registered to the 1280x720 colour grid; its native depth mode and
  RealSense post-processing (spatial, temporal, hole-filling filters) are not recorded,
  and a spatial filter alone produces correlated error
- the robot's depth mode is not chosen and the target K (fx 465.74) is synthetic;
  widths are converted by the focal-length ratio, assuming the correlation is fixed
  in angle
- the +-0.5 mm dither adds its own small variance and the MAD scale assumes a Gaussian;
  neither is corrected
- 'a fresh field is drawn per scene: any fixed-pattern part of the error is not reproduced,
  so gains from multi-frame fusion would be overstated'
- dropout is modelled as independent pixels at the background rate; structured holes
  on pallets (grazing top boards, occlusion shadows) are reported in pallet_surface,
  not modelled
- edge mixing (flying pixels), quantisation and RGB registration keep the model's
  assumed defaults
