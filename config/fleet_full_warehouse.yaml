# Five-truck fleet on the whole NVIDIA Isaac 5.1 Simple_Warehouse/full_warehouse.usd
# (docs/plans/2026-10-08-fleet-five-forklifts.md). Metres and radians, world frame.
#
# Measured 2026-10-08 on ws1 with usd-core 26.8 from the S3 copy (2,007 layers):
# every Mesh with vertices in the z 0.02-2.0 m band, bounded by those vertices
# (not by its bounding box -- the diagonal roof braces from the wall pillars
# would otherwise show up as 9 m floor bars).
#   inner wall faces   west x = -26.13, east x = 5.26, south y = -23.2, north y = 30.4
#   floor obstacles    seven north-south racks (below), the clutter in aisle 5,
#                      a fuse box on the north wall (v2 below adds what this missed)
# The racks are kept as they are (scenery and obstacles); nothing is picked
# from them. Everything else here is a synthetic layout choice.
#
# Corrected 2026-10-09 (v2) after a truck stopped dead at the mouth of aisle 6
# in the Isaac smoke: the 10/08 mirror had failed to fetch the one layer
# outside the warehouse folder (../../Props/Forklift/forklift.usd, NVIDIA's
# parked forklift), and two wet-floor signs at the mouth of aisle 5 were not
# in the mesh list either (cause not found). A surface-sampled pass over every
# collision mesh (not only vertices) found nothing else in the band beyond
# 1-3 mm slivers at rack edges.
layout_version: fleet_full_warehouse_v2

# Storage stacks, clutter and the five shipping docks of the south hall come
# from this layout's generator; its kept-clear bay becomes the parking area.
south_hall_layout: factory_south_hall.yaml

# Planning bounds: 0.4 m inside the west/south walls as the south hall layout
# keeps, 0.41 m inside the east wall and 0.4 m inside the north wall.
bounds: {x_min_m: -25.7, x_max_m: 4.85, y_min_m: -22.9, y_max_m: 30.0}

# Union of each rack's floor-band meshes (frames, shields, the pallets and
# boxes on its bottom level, which stick out up to 0.17 m). The aisle 5
# clutter (29 boxes, barrels, crates and cones, top 0.97 m) closes aisle 5.
fixed_obstacles:
  - {name: rack_1, x_min_m: -25.925, x_max_m: -24.607, y_min_m: 8.802, y_max_m: 25.142}
  - {name: rack_2, x_min_m: -21.043, x_max_m: -19.761, y_min_m: 8.694, y_max_m: 25.002}
  - {name: rack_3, x_min_m: -16.047, x_max_m: -14.810, y_min_m: 8.802, y_max_m: 25.142}
  - {name: rack_4, x_min_m: -11.071, x_max_m: -9.747, y_min_m: 8.694, y_max_m: 25.098}
  - {name: rack_5, x_min_m: -6.213, x_max_m: -4.497, y_min_m: 8.601, y_max_m: 25.142}
  - {name: rack_6, x_min_m: -1.649, x_max_m: 0.163, y_min_m: 8.694, y_max_m: 25.098}
  - {name: rack_7, x_min_m: 3.737, x_max_m: 5.019, y_min_m: 8.706, y_max_m: 25.142}
  - {name: aisle_5_clutter, x_min_m: -4.553, x_max_m: -1.563, y_min_m: 8.823, y_max_m: 14.597}
  - {name: wet_floor_sign_a, x_min_m: -3.669, x_max_m: -3.368, y_min_m: 8.632, y_max_m: 8.907}
  - {name: wet_floor_sign_b, x_min_m: -1.785, x_max_m: -1.457, y_min_m: 8.555, y_max_m: 8.864}
  - {name: fuse_box, x_min_m: 1.258, x_max_m: 1.797, y_min_m: 30.186, y_max_m: 30.6}

# Warehouse prims the runner deactivates (paths under the warehouse root).
# NVIDIA's parked forklift (body x 1.43-3.74, y 10.19-11.41, up to 2.15 m,
# forks in rack 7) takes the east 2.3 m of aisle 6; the five fleet trucks do
# its job here, and each needs an aisle of its own. Claude's choice.
removed_prims: [forklift]

# Usable aisles between the racks (aisle 5 is closed). A truck may use only
# the aisle of its intake pallet; every other aisle is an obstacle for it.
aisles:
  - {name: aisle_1, x_min_m: -24.607, x_max_m: -21.043}
  - {name: aisle_2, x_min_m: -19.761, x_max_m: -16.047}
  - {name: aisle_3, x_min_m: -14.810, x_max_m: -11.071}
  - {name: aisle_4, x_min_m: -9.747, x_max_m: -6.213}
  - {name: aisle_6, x_min_m: 0.163, x_max_m: 3.737}
aisle_y_m: [8.6, 25.15]

# Intake pallets in the north strip, one in front of each usable aisle,
# centred on it, forks entering northwards (pallet centre, insertion heading).
intake_y_m: 27.6
# Rear-axle pose at the aisle's south mouth, facing north, where the travel
# leg from parking ends and the pickup-side stages begin.
aisle_entry_y_m: 6.8

# Trucks leave their parking place straight ahead for this far and come back
# in straight ahead from this far behind it: the measured truck turns on a
# 3.45 m radius and the places are 1.6 m apart, so swinging out of or into the
# row would sweep over the neighbours (first Isaac smoke, 2026-10-08). The turn
# clears them once the straight is the unloaded length plus both traffic
# margins, 1.46 + 2 x 0.3 = 2.06 m. 3.5 m put the westmost place's last turn
# into the stacks and clutter at y -8.6 (no return path, seeds 0 and 1).
parking_exit_m: 2.2
parking_entry_m: 2.2

# Parking in the former bay (south hall keep_clear x -3.0..4.7, y -4.3..4.6):
# rear axles in a row, facing north, 1.6 m apart.
parking:
  - [-2.2, -2.0, 1.5707963267948966]
  - [-0.6, -2.0, 1.5707963267948966]
  - [1.0, -2.0, 1.5707963267948966]
  - [2.6, -2.0, 1.5707963267948966]
  - [4.2, -2.0, 1.5707963267948966]
