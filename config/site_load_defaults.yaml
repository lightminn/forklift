# Site default load declaration for known pallet shapes, used when a task
# instruction gives no mass (user decision 2026-10-15). A site policy, not a
# measurement: the pallet masses equal the measured chassis' simulation table
# pallet_mass_kg in config/isaac_transport_measured*.yaml -- the expected weight
# of a printed test article, an estimate (docs/plans/2026-11-01-pallet-mass.md).
# The provisional settings (isaac_transport.yaml, _fast) keep 10 kg for their old
# baselines. Change it per site; results record the source.
source: site_default
shapes:
  epal6: {pallet_mass_kg: 4.93, load_mass_kg: 0.0, com: centred}
  t11_06: {pallet_mass_kg: 2.49, load_mass_kg: 0.0, com: centred}
  t11_06_d600: {pallet_mass_kg: 2.49, load_mass_kg: 0.0, com: centred}  # the shallow T11 cycle test article
