# The SLAM survey epoch's tour (SLAM localization plan docs/plans/2026-10-20-slam-localization-session.md L2 v2.5)
# for config/factory_south_hall.yaml (south_hall_v2), seed 0. Rear-axle poses (x m, y m, yaw rad) in the world frame;
# tools/survey_tour.py joins them from the truck's home and back with the run's own travel planner.
#
# aisles: the centrelines of the hall's aisle network, between the storage rows (y 2.0-4.6, -4.6- -2.0, -11.2- -8.6,
# -17.8- -15.2) and their columns (x -20.6- -13.4, -9.4- -3.0/-1.4): horizontal y 6.45, 0.0, -6.6, -13.2 and the yard
# -19.6; vertical x -23.0 (west), -11.4 (between the columns) and the east zone, 6-7.7 m wide, as two lines -1.0, 2.9.
# The judged region is these bands (1.5 m either side) plus the work approaches, observation poses and home.
aisles:
  - [[-23.0, 6.45], [2.9, 6.45]]
  - [[-23.0, 0.0], [2.9, 0.0]]
  - [[-23.0, -6.6], [2.9, -6.6]]
  - [[-23.0, -13.2], [2.9, -13.2]]
  - [[-23.0, -19.6], [2.9, -19.6]]
  - [[-23.0, -19.6], [-23.0, 6.45]]
  - [[-11.4, -19.6], [-11.4, 6.45]]
  - [[-1.0, -19.6], [-1.0, 6.45]]
  - [[2.9, -19.6], [2.9, 6.45]]
