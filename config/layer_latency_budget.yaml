# The obstacle layer's latency budget (docs/plans/2026-11-11-layer-latency-budget.md, the lead's decision 2026-11-11).
# B bounds the delay from a scan to the first control use of its result; the runner closes it (stopping latency + B,
# FREE use age free_max_age_s + B) and the layer's watchdog stops the truck when a result is later than B; a watchdog
# stop over overdue_end_s in a row ends the mission (layer_latency_exceeded). Kept apart from the obstacle-layer files:
# those are survey map bundles' shared inputs (forklift_core.localization.slam_map.SHARED_INPUTS) and a changed file
# would refuse every accepted bundle. Passed by the riib, console and survey launchers (--layer-latency-budget).
# Decided values, not measured.
latency_budget_s: 0.10
overdue_end_s: 1.0
