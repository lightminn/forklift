[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forklift-core"
version = "0.1.0"
description = "Hardware-independent sensor geometry for the forklift assignment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]
model = ["PyYAML>=6", "mujoco>=3.3,<4", "Pillow>=10"]
dataset = ["Pillow>=10"]
dev = ["pytest>=7", "ruff", "build", "pip-tools", "Pillow>=10", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["forklift_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "simulation: requires the optional model dependencies and MuJoCo",
    "rendering: requires an explicitly enabled graphics context",
]

[tool.ruff]
src = [".", "src"]
line-length = 88
target-version = "py310"
extend-exclude = [
    "presentation",
    "artifacts",
    "data",
    "build",
    "dist",
    "*.egg-info",
    "ros2/build",
    "ros2/install",
    "ros2/log",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
