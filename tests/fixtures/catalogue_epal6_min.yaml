# Minimal EPAL 6 catalogue: enough scenes to exercise the world generator's
# second geometry, and nothing more. Without it the generator's own tests can
# only draw fixtures from the committed v1 catalogue, so the branch that emits
# a real pallet has no scene to run on.
#
# The pocket convention below (y +/-0.18625, z 0.061, width 0.2275, height
# 0.078) is the complement of the pallet's boxes and appears nowhere in the
# URDF. It is derived from config/pallet_geometry_epal6.yaml, and
# tests/integration/test_pallet_model_build.py re-derives it from the URDF's
# own extents so the two cannot drift.
format_version: 1
catalogue_version: epal6
seed: 20260914
generator: handwritten test fixture
source_provenance: synthetic
camera:
  width: 640
  height: 480
  horizontal_fov_rad: 1.204
  rate_hz: 5
  translation_m: [0.75, 0.0, 0.5]
  optical_quaternion_xyzw: [-0.5, 0.5, -0.5, 0.5]
pallet:
  depth_m: 0.6
  width_m: 0.8
  height_m: 0.144
  deck_bottom_m: 0.022
  deck_top_m: 0.044
  center_spacer_m: 0.145
  opening_height_m: 0.078
ranges:
  x_m: [2.0, 4.0]
  y_m: [-1.0, 1.0]
  yaw_rad: [-0.52, 0.52]
  opening_width_m: [0.2, 0.28]
  occluder_gap_m: [0.3, 0.6]
  occluded_fraction: [0.2, 0.6]
distractor_presets:
  crate_a:
    center_m: [1.5, 1.6, 0.2]
    size_m: [0.4, 0.4, 0.4]
    color: ".5 .5 .5 1"
